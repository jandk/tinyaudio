name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Install libvorbis
        run: sudo apt-get update && sudo apt-get install -y libvorbis0a

      - name: Cache test vectors
        uses: actions/cache@v6
        with:
          path: |
            test-vectors/opus
            test-vectors/vorbis
          key: test-vectors-${{ hashFiles('scripts/*.sha256') }}

      - name: Download test vectors
        run: |
          bash scripts/opus-vectors.sh
          bash scripts/vorbis-vectors.sh

      - name: Build with Maven
        run: mvn -B verify --file pom.xml
